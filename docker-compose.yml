version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading-ai-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    command: python api.py --host 0.0.0.0
    networks:
      - trading-ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-ai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:5000
    networks:
      - trading-ai-network

networks:
  trading-ai-network:
    driver: bridge
